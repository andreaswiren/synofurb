# Managed by synofurb-mgmt (synofurb_edge.py). Do not edit by hand: the next apply overwrites this file.

global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305

defaults
    log global
    mode http
    timeout connect 5s
    timeout client 5m
    timeout server 5m
    timeout tunnel 1h
    timeout http-request 30s
    timeout http-keep-alive 10s
    retries 2

# Port 80: HTTP-01 challenges go to lego on loopback, everything else is redirected to https.
frontend fe_http
    mode http
    option httplog
    bind 0.0.0.0:80
    bind :::80 v6only
    acl acme_challenge path_beg /.well-known/acme-challenge/
    use_backend be_acme_http if acme_challenge
    http-request redirect scheme https code 301 unless acme_challenge

backend be_acme_http
    mode http
    server lego 127.0.0.1:5080

# Port 443, TCP level: a connection that offers the ALPN protocol acme-tls/1 is a TLS-ALPN-01 validation and goes to lego;
# everything else goes to the TLS terminator below (PROXY protocol keeps the client address).
frontend fe_tls
    mode tcp
    option tcplog
    bind 0.0.0.0:443
    bind :::443 v6only
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend be_acme_alpn if { req.ssl_alpn acme-tls/1 }
    default_backend be_tls_terminator

backend be_acme_alpn
    mode tcp
    server lego 127.0.0.1:5443

backend be_tls_terminator
    mode tcp
    server terminator 127.0.0.1:8444 send-proxy-v2

# The TLS terminator (loopback only). SNI picks the certificate (crt-list); the Host header picks the backend.
# Any other name, or an IP address, reaches the management plane, so the unit stays reachable.
frontend fe_https
    mode http
    option httplog
    bind 127.0.0.1:8444 accept-proxy ssl crt-list /etc/haproxy/synofurb-crt-list.txt alpn h2,http/1.1
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto https
    default_backend be_mgmt

backend be_mgmt
    mode http
    server mgmt 127.0.0.1:8443 ssl verify none
