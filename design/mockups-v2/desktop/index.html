*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;height:100%}html[data-size=large]{font-size:18.4px}html[data-size=largest]{font-size:20.8px}
body{height:100%;font:400 .875rem/1.25rem var(--font);font-variant-numeric:tabular-nums;background:var(--page);color:var(--fg);-webkit-font-smoothing:antialiased;overflow:hidden}
:root{--font:Inter,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;--r:.5rem;--rl:.75rem;--page:#d9d9de;--shadow:0 1.5rem 3rem -.75rem rgb(0 0 0/.35),0 0 0 1px rgb(0 0 0/.12)}
:root[data-theme=dark]{--page:#050505}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
.mono,.d.mono{font-family:var(--mono);font-size:.8125rem;line-height:1.25rem}
.ic{width:1rem;height:1rem;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.1875rem}
.ic.s{width:.875rem;height:.875rem}.ic.l{width:1.25rem;height:1.25rem}.ic.xl{width:1.5rem;height:1.5rem}
.spin{animation:sp 1.1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}
/* scrollbars (DS section 6): 6px thumb, 8px on hover, pill, no arrows, transparent track. Chromium cannot overlay a scrollbar, so the prototype reserves
   12px (GPUI: 16px hit area drawn over the content, nothing reserved) and `scrollbar-gutter:stable` keeps layouts from shifting. */
*::-webkit-scrollbar{width:12px;height:12px}*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--sb-thumb);border:3px solid transparent;background-clip:content-box;border-radius:999px;min-height:48px;min-width:48px}
*::-webkit-scrollbar-thumb:hover,*::-webkit-scrollbar-thumb:active{background:var(--sb-thumb-hover);border-width:2px}
*::-webkit-scrollbar-corner{background:transparent}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:var(--sb-thumb) transparent}}
/* window */
#stage{height:100%;display:grid;place-items:center;padding:16px}
#stage.bare{padding:0}
.win{container:win/inline-size;width:min(100%,1280px);height:min(100%,800px);background:var(--canvas);border-radius:var(--rl);box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:2.375rem auto auto minmax(0,1fr) auto 1.5rem;position:relative}
.bare .win{border-radius:0;box-shadow:none;width:100%;height:100%}
.titlebar{grid-row:1;display:flex;align-items:center;gap:.5rem;padding:0 0 0 1rem;background:var(--surface-2);border-bottom:1px solid var(--border);user-select:none}
.titlebar .brand{display:flex;align-items:center;gap:.5rem;font-weight:600}
.titlebar .brand .mk{width:1.25rem;height:1.25rem;display:block}.titlebar .brand .wm{display:flex;font-weight:600}.titlebar .brand .wm b{font-weight:600;color:var(--accent-fg)}
.titlebar .sp{flex:1}
.titlebar .btn.icon{height:1.75rem;width:1.75rem}
.wc{display:flex;height:100%}.wc i{width:2.875rem;display:grid;place-items:center;color:var(--fg-2)}.wc i:hover{background:var(--surface-3)}.wc i:last-child:hover{background:#c42b1c;color:#fff}
.wc svg{width:.875rem;height:.875rem;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
/* stepper: gpui-component Stepper, text-centred layout. Indicator 24px disc (secondary / primary), 4px gap, label text_sm below, 2px connector in the `border` token.
   Custom parts (DS exceptions): the failed disc (circle-x in danger), the check icon on done, the semibold current label. */
.stepper{grid-row:2;display:flex;align-items:flex-start;padding:.25rem 1.5rem;height:3.5rem;background:var(--surface);border-bottom:1px solid var(--border)}
.stepper .item{display:flex;flex:1 1 0;min-width:0;align-items:flex-start;justify-content:center}.stepper .item:last-child{flex:0 0 auto}
.step{display:flex;flex-direction:column;align-items:center;gap:.25rem;color:var(--fg);border-radius:var(--r);min-width:0}
button.step:hover .n{background:var(--surface-3)}
.step .n{width:1.5rem;height:1.5rem;border-radius:50%;display:grid;place-items:center;font-size:.875rem;line-height:1;background:var(--surface-2);color:var(--fg);flex:none}
.step .n .ic{width:.875rem;height:.875rem}
.step .lbl{font-size:.875rem;line-height:1.25rem;white-space:nowrap;color:var(--fg-2)}
.step.done .n,.step.cur .n{background:var(--accent);color:var(--on-accent)}.step.done .lbl{color:var(--fg)}
.step.cur .lbl{color:var(--fg);font-weight:600}
.step.fail .n{background:var(--err-fg);color:var(--on-err)}.step.fail .lbl{color:var(--err-fg);font-weight:600}
button.step.done:hover .n{background:var(--accent-hover)}
.step-line{flex:1 1 0;min-width:.5rem;height:2px;margin:.6875rem .5rem 0;background:var(--border)}
.stepper .item:last-child .step-line{display:none}
.unithdr{display:flex;align-items:center;gap:.75rem;padding:.375rem 1.5rem;background:var(--canvas);border-bottom:1px solid var(--border);height:3.5rem;overflow:hidden}
.unithdr .tile{width:2.5rem;height:2.5rem;flex:none;border-radius:var(--r);background:var(--accent-bg);color:var(--accent-fg);display:grid;place-items:center;border:1px solid var(--accent-border)}
.unithdr .nm{font-size:1rem;font-weight:600;line-height:1.5rem}
.unithdr .meta{display:flex;gap:0 .75rem;flex-wrap:nowrap;color:var(--fg-2);align-items:center;white-space:nowrap}
.unithdr .sp{flex:1}.unithdr .facts{display:flex;gap:1rem;color:var(--fg-2);white-space:nowrap}
.unithdr .grow{min-width:0}
.top{grid-row:3;min-width:0}
.main{grid-row:4;overflow:auto;padding:1.5rem .75rem;scrollbar-gutter:stable both-edges;position:relative;min-height:0}
.main.pad0{padding:0}
.page{margin:0;display:flex;flex-direction:column;gap:1rem;min-height:100%}
.page.narrow{max-width:35rem}
.ph{display:flex;gap:1rem;align-items:flex-end;flex-wrap:wrap}.ph .sp{flex:1}
h1{font-size:1.5rem;line-height:2rem;font-weight:700}
h2{font-size:1rem;line-height:1.5rem;font-weight:600}
.sub{color:var(--fg-2)}
.foot{grid-row:5;display:flex;align-items:center;gap:.5rem;padding:0 1.5rem;height:4rem;background:var(--surface);border-top:1px solid var(--border);min-width:0}
.foot .sp{flex:1}
.foot .why{display:inline-flex;align-items:center;gap:.25rem;color:var(--fg-2);min-width:0}
.stepper{order:0}
.statusbar{grid-row:6;display:flex;align-items:center;gap:.75rem;padding:0 .75rem;background:var(--surface-2);border-top:1px solid var(--border);font-size:.75rem;line-height:1rem;color:var(--fg-2)}
.statusbar .sp{flex:1}
.statusbar .tag{padding-top:0;padding-bottom:0}

.link{display:inline-flex;align-items:center;min-height:1.5rem;color:var(--link);text-decoration:underline;text-underline-offset:2px;cursor:pointer;background:none;border:0;padding:0}.link:hover{color:var(--accent-hover)}

/* tag: gpui-component Tag, Medium: text_xs 12, line-height 1.25 (15px), px 10, py 4, 1px border, weight 400, radius 8. Neutral tags = Tag::custom with border_strong */

.row{display:flex;align-items:center;gap:.5rem}.row.wrap{flex-wrap:wrap}.grow{flex:1}.col{display:flex;flex-direction:column;gap:.5rem}
.gap16{gap:1rem}.gap12{gap:.75rem}.mt8{margin-top:.5rem}

<script>const HELP=[{"id": "first-install", "title": "First install", "html": "<ol><li>Scan, pick your unit and connect. Enable SSH in DSM first (Control Panel, Terminal and SNMP).</li><li>Inspect is read-only.</li><li>Choose Boot manager to try the agent, or Install Debian.</li><li>Plan storage, set the system options, then confirm.</li></ol><p>The install takes about 25 minutes. Kernel: Stable is Debian's 6.12 LTS; Newest is 7.x from trixie-backports and falls back to Stable if it cannot be installed.</p><p>Source: Online needs Internet on the NAS; Offline uses a bundle you downloaded in Settings. Afterwards the data array syncs for about 9 hours; the NAS works meanwhile with reduced protection.</p><p>Copy the generated password on the last screen: synofurb does not keep it.</p>", "text": "  Scan, pick your unit and connect. Enable SSH in DSM first (Control Panel, Terminal and SNMP).  Inspect is read-only.  Choose Boot manager to try the agent, or Install Debian.  Plan storage, set the system options, then confirm.   The install takes about 25 minutes. Kernel: Stable is Debian's 6.12 LTS; Newest is 7.x from trixie-backports and falls back to Stable if it cannot be installed.  Source: Online needs Internet on the NAS; Offline uses a bundle you downloaded in Settings. Afterwards the data array syncs for about 9 hours; the NAS works meanwhile with reduced protection.  Copy the generated password on the last screen: synofurb does not keep it. "}, {"id": "compat-status", "title": "Status meanings", "html": "<p>Each model has one status.</p><p><b>Verified</b>: maintainers or two independent people installed it, with logs. No model has this yet.</p><p><b>Community-reported</b>: at least one report exists. DS923+ has one, from another project.</p><p><b>Untested</b>: no report. The hardware class should work in theory; that is not a promise, and your install is the test.</p><p><b>Known issues</b>: reports show something fails or only partly works.</p><p><b>Unsupported</b>: Debian 13 cannot run on this hardware; synofurb refuses to install.</p><p>Only Unsupported blocks. The list ships with the app and refreshes from the project repository; offline it uses the cached copy.</p>", "text": " Each model has one status.   Verified : maintainers or two independent people installed it, with logs. No model has this yet.   Community-reported : at least one report exists. DS923+ has one, from another project.   Untested : no report. The hardware class should work in theory; that is not a promise, and your install is the test.   Known issues : reports show something fails or only partly works.   Unsupported : Debian 13 cannot run on this hardware; synofurb refuses to install.  Only Unsupported blocks. The list ships with the app and refreshes from the project repository; offline it uses the cached copy. "}, {"id": "backups", "title": "Backups", "html": "<p>Your own backup is essential. In Wipe mode nothing on the disks is preserved; in Keep mode the data volume is left alone on a best-effort basis with no guarantee.</p><p>synofurb also saves on this computer:</p><ul><li><b>Boot-flash image</b>: the whole flash, hash-verified, before the first flash write. Keep it off the NAS.</li><li><b>Disk metadata backup</b>: the first and last 1 MiB of every disk we change (partition tables, GPT headers). That is metadata only, not your files, and it cannot bring back a formatted filesystem.</li><li>The plan, the install script and the log.</li></ul>", "text": " Your own backup is essential. In Wipe mode nothing on the disks is preserved; in Keep mode the data volume is left alone on a best-effort basis with no guarantee.  synofurb also saves on this computer:    Boot-flash image : the whole flash, hash-verified, before the first flash write. Keep it off the NAS.   Disk metadata backup : the first and last 1 MiB of every disk we change (partition tables, GPT headers). That is metadata only, not your files, and it cannot bring back a formatted filesystem.  The plan, the install script and the log.  "}, {"id": "recovery", "title": "Recovery", "html": "<p>DSM stays the default boot entry; every failure points it back at DSM.</p><table><thead><tr><th>When</th><th>What happens</th></tr></thead><tbody><tr><td>Before the boot flash is changed</td><td>Nothing to undo</td></tr><tr><td>Agent installed</td><td>The agent resets the default to DSM first; it reboots to DSM if nobody logs in</td></tr><tr><td>Before step 3</td><td>A failure reboots to DSM after 60 s; a power cycle also works</td></tr><tr><td>After step 3</td><td>Rescue shell for 15 minutes, then the DSM loader runs; DSM's own system may be gone, reinstall it from Synology (find.synology.com); no data promise</td></tr><tr><td>Debian installed</td><td>Pick the previous kernel in the boot menu or boot DSM</td></tr></tbody></table><p>Commands: <code>synofurb recover</code>, <code>synofurb boot-manager enter</code>.</p>", "text": " DSM stays the default boot entry; every failure points it back at DSM.     When  What happens      Before the boot flash is changed  Nothing to undo    Agent installed  The agent resets the default to DSM first; it reboots to DSM if nobody logs in    Before step 3  A failure reboots to DSM after 60 s; a power cycle also works    After step 3  Rescue shell for 15 minutes, then the DSM loader runs; DSM's own system may be gone, reinstall it from Synology (find.synology.com); no data promise    Debian installed  Pick the previous kernel in the boot menu or boot DSM     Commands:  synofurb recover ,  synofurb boot-manager enter . "}, {"id": "boot-manager", "title": "Boot manager", "html": "<p>x86 units boot through a small internal boot flash. Boot manager adds an SSH agent entry to it.</p><p>The whole flash is saved to this computer first; disks are untouched; DSM's entry stays and stays the default.</p><p>The agent is one-shot: it resets the default to DSM when it starts and reboots to DSM after 30 minutes without a login. From it, <code>sf-boot kexec &lt;kernel-url> &lt;initrd-url></code> starts another Linux kernel. kexec starts Linux kernels only, not Windows or UEFI-only ISOs.</p><p>Once another system runs, nothing of ours is running: power-cycling returns to the default entry. That system can see and change your disks.</p>", "text": " x86 units boot through a small internal boot flash. Boot manager adds an SSH agent entry to it.  The whole flash is saved to this computer first; disks are untouched; DSM's entry stays and stays the default.  The agent is one-shot: it resets the default to DSM when it starts and reboots to DSM after 30 minutes without a login. From it,  sf-boot kexec &lt;kernel-url> &lt;initrd-url>  starts another Linux kernel. kexec starts Linux kernels only, not Windows or UEFI-only ISOs.  Once another system runs, nothing of ours is running: power-cycling returns to the default entry. That system can see and change your disks. "}, {"id": "serial-console", "title": "Serial console", "html": "<p>A serial console shows boot messages and lets you log in without a network. Intel units usually use <code>ttyS0</code> at 115200 8N1; the app reads the setting from DSM's kernel command line.</p><p>AMD units have a memory-mapped UART; the exact console argument is copied from DSM. ARM boards need a 3.3 V TTL serial adapter (not RS-232 levels); without it you cannot recover an ARM unit over SSH alone.</p><p>Debian also opens a login on any USB serial adapter you plug in later.</p>", "text": " A serial console shows boot messages and lets you log in without a network. Intel units usually use  ttyS0  at 115200 8N1; the app reads the setting from DSM's kernel command line.  AMD units have a memory-mapped UART; the exact console argument is copied from DSM. ARM boards need a 3.3 V TTL serial adapter (not RS-232 levels); without it you cannot recover an ARM unit over SSH alone.  Debian also opens a login on any USB serial adapter you plug in later. "}, {"id": "offline-mode", "title": "Offline mode", "html": "<p>Offline installs use a bundle: the installer files and packages for one CPU architecture. Download it in Settings, Data (this computer needs Internet once).</p><p>In System, choose Source: Offline and select the bundle. The NAS then needs no Internet during the install.</p><p>The compatibility list also works offline from its cached copy. Update checks, list refresh and result reports need Internet and are disabled while offline.</p>", "text": " Offline installs use a bundle: the installer files and packages for one CPU architecture. Download it in Settings, Data (this computer needs Internet once).  In System, choose Source: Offline and select the bundle. The NAS then needs no Internet during the install.  The compatibility list also works offline from its cached copy. Update checks, list refresh and result reports need Internet and are disabled while offline. "}, {"id": "cli", "title": "Command line", "html": "<p>Everything in the app is also a command, and the command line is the screen-reader accessible path (the app window does not support screen readers).</p><p><code>synofurb scan</code> discovers units.</p><p><code>synofurb plan --host &lt;ip> --user &lt;admin></code> shows the plan, read-only.</p><p><code>synofurb install ... --have-backup --accept-data-loss --confirm</code> converts a unit.</p><p><code>synofurb recover</code> and <code>synofurb boot-manager enter</code> handle recovery.</p><p>The Copy command button on Plan, System and Confirm copies the equivalent command. On Confirm the three confirmation flags are included only after you confirm.</p>", "text": " Everything in the app is also a command, and the command line is the screen-reader accessible path (the app window does not support screen readers).   synofurb scan  discovers units.   synofurb plan --host &lt;ip> --user &lt;admin>  shows the plan, read-only.   synofurb install ... --have-backup --accept-data-loss --confirm  converts a unit.   synofurb recover  and  synofurb boot-manager enter  handle recovery.  The Copy command button on Plan, System and Confirm copies the equivalent command. On Confirm the three confirmation flags are included only after you confirm. "}, {"id": "troubleshooting", "title": "Troubleshooting", "html": "<p><b>No units found</b>: wrong network or VLAN, NAS still booting, firewall (UDP 9999, mDNS 5353, TCP 22). Use Add by IP.</p><p><b>SSH is off</b>: enable it in DSM, Control Panel, Terminal and SNMP.</p><p><b>Login failed</b>: DSM may auto-block this computer after a few failures; check the account is an administrator.</p><p><b>Installer did not come up</b>: DSM is already the default; wait, then power-cycle.</p><p><b>Boot flash write failed</b>: the tool restores the flash and verifies it; use the rescue shell within 15 minutes.</p><p>Logs: <code>~/.local/share/synofurb/logs</code> (secrets removed). Settings, Logs opens the folder; About copies diagnostics.</p>", "text": "  No units found : wrong network or VLAN, NAS still booting, firewall (UDP 9999, mDNS 5353, TCP 22). Use Add by IP.   SSH is off : enable it in DSM, Control Panel, Terminal and SNMP.   Login failed : DSM may auto-block this computer after a few failures; check the account is an administrator.   Installer did not come up : DSM is already the default; wait, then power-cycle.   Boot flash write failed : the tool restores the flash and verifies it; use the rescue shell within 15 minutes.  Logs:  ~/.local/share/synofurb/logs  (secrets removed). Settings, Logs opens the folder; About copies diagnostics. "}, {"id": "report-result", "title": "Report a result", "html": "<p>Reports move a model from Untested towards Verified. After an install, press Report result on the Done screen.</p><p>It opens a pre-filled GitHub issue (compat report template) with the model, DSM version, synofurb version, result, boot method and a log excerpt without secrets. The serial number is left out.</p><p>Nothing is sent without your click, and Settings, Privacy has an off switch. A maintainer checks the log and changes the status through a reviewed pull request.</p>", "text": " Reports move a model from Untested towards Verified. After an install, press Report result on the Done screen.  It opens a pre-filled GitHub issue (compat report template) with the model, DSM version, synofurb version, result, boot method and a log excerpt without secrets. The serial number is left out.  Nothing is sent without your click, and Settings, Privacy has an off switch. A maintainer checks the log and changes the status through a reviewed pull request. "}, {"id": "raid-levels", "title": "RAID levels", "html": "<p>RAID combines disks into one array. <b>None</b>: one disk, no protection. <b>RAID 0</b>: striped and fast; any failure loses everything (2+ disks). <b>RAID 1</b>: mirror, survives all but one disk (2+). <b>RAID 5</b>: survives one failed disk; usable space is (n-1) disks (3+). <b>RAID 6</b>: survives two; usable (n-2) disks (4+). <b>RAID 10</b>: mirrored stripes, survives one disk per mirror, half the capacity (4+). Equal-size levels use the smallest disk's size on every member, so larger disks waste space; Hybrid avoids that.</p><p>RAID is not a backup: it does not protect against deletion, corruption or fire. A new array syncs for hours and works meanwhile with reduced protection.</p>", "text": " RAID combines disks into one array.  None : one disk, no protection.  RAID 0 : striped and fast; any failure loses everything (2+ disks).  RAID 1 : mirror, survives all but one disk (2+).  RAID 5 : survives one failed disk; usable space is (n-1) disks (3+).  RAID 6 : survives two; usable (n-2) disks (4+).  RAID 10 : mirrored stripes, survives one disk per mirror, half the capacity (4+). Equal-size levels use the smallest disk's size on every member, so larger disks waste space; Hybrid avoids that.  RAID is not a backup: it does not protect against deletion, corruption or fire. A new array syncs for hours and works meanwhile with reduced protection. "}, {"id": "hybrid-raid", "title": "Hybrid RAID", "html": "<p>Hybrid (SHR-style) mixes disk sizes. synofurb cuts the disks' data space into slices at the sizes of the different disks; every slice on two or more disks becomes an array (RAID 1 for two members, RAID 5 for three or more; Hybrid 2-disk uses RAID 6 for four or more). LVM joins the arrays into one volume.</p><p>Example: 4, 4 and 8 TB with Hybrid 1-disk gives 8 TB usable; the extra 4 TB on the large disk has no partner and stays unused. Hybrid 1-disk survives any one disk; Hybrid 2-disk any two where a slice has four or more members.</p><p>It is built with mdadm and LVM, so Debian manages it. DSM may not adopt it, and DSM-made volumes import read-only.</p><p>Nothing here has run on a real Synology.</p>", "text": " Hybrid (SHR-style) mixes disk sizes. synofurb cuts the disks' data space into slices at the sizes of the different disks; every slice on two or more disks becomes an array (RAID 1 for two members, RAID 5 for three or more; Hybrid 2-disk uses RAID 6 for four or more). LVM joins the arrays into one volume.  Example: 4, 4 and 8 TB with Hybrid 1-disk gives 8 TB usable; the extra 4 TB on the large disk has no partner and stays unused. Hybrid 1-disk survives any one disk; Hybrid 2-disk any two where a slice has four or more members.  It is built with mdadm and LVM, so Debian manages it. DSM may not adopt it, and DSM-made volumes import read-only.  Nothing here has run on a real Synology. "}, {"id": "replace-disk", "title": "Replacing a failed disk", "html": "<p>A failed member leaves the array degraded: it works, but one more failure may lose data (RAID 5). 1.</p><p>Check the disk on the Dashboard or RAID page. 2.</p><p>Choose the new disk; it is erased and must be at least as large. 3.</p><p>The tool marks the old member failed, removes it and adds the new one. 4.</p><p>The rebuild runs for hours; progress and speed are shown, and other operations wait. Do not power off.</p><p>To upgrade a healthy member, the tool adds a spare and uses a replace operation, so redundancy is kept during the swap. After replacing every member with a larger disk you can grow the array.</p><p>Each step shows its exact commands and asks you to type REPLACE and the disk name.</p>", "text": " A failed member leaves the array degraded: it works, but one more failure may lose data (RAID 5). 1.  Check the disk on the Dashboard or RAID page. 2.  Choose the new disk; it is erased and must be at least as large. 3.  The tool marks the old member failed, removes it and adds the new one. 4.  The rebuild runs for hours; progress and speed are shown, and other operations wait. Do not power off.  To upgrade a healthy member, the tool adds a spare and uses a replace operation, so redundancy is kept during the swap. After replacing every member with a larger disk you can grow the array.  Each step shows its exact commands and asks you to type REPLACE and the disk name. "}, {"id": "scrubbing", "title": "Scrubbing", "html": "<p>A scrub reads every block and compares copies or parity to find silent errors. Check only counts mismatches; Repair also rewrites them and needs a typed confirmation.</p><p>Debian's mdcheck timer runs a scrub monthly; you can start one or stop it (idle) from the RAID page. The array stays usable but slower while it runs, and speed limits can be tuned.</p><p>A non-zero mismatch count on a healthy array deserves attention: check SMART on every member. A scrub cannot start while the array is resyncing or reshaping.</p>", "text": " A scrub reads every block and compares copies or parity to find silent errors. Check only counts mismatches; Repair also rewrites them and needs a typed confirmation.  Debian's mdcheck timer runs a scrub monthly; you can start one or stop it (idle) from the RAID page. The array stays usable but slower while it runs, and speed limits can be tuned.  A non-zero mismatch count on a healthy array deserves attention: check SMART on every member. A scrub cannot start while the array is resyncing or reshaping. "}];const LOGO="<span class=\"lg-l\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\" role=\"img\" aria-label=\"synofurb\"><path d=\"M69.88 48.44L81.51 68.57Q85.51 75.50 77.51 75.50L69.84 75.50\" fill=\"none\" stroke=\"#7139CB\" stroke-width=\"12.5\" stroke-linecap=\"butt\" stroke-linejoin=\"round\"/><polygon points=\"52.84,75.50 70.84,62.18 70.84,88.82\" fill=\"#7139CB\" stroke=\"#7139CB\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><path d=\"M45.74 75.50L22.49 75.50Q14.49 75.50 18.49 68.57L22.33 61.93\" fill=\"none\" stroke=\"#7139CB\" stroke-width=\"12.5\" stroke-linecap=\"butt\" stroke-linejoin=\"round\"/><polygon points=\"30.83,47.21 33.36,69.46 10.29,56.14\" fill=\"#7139CB\" stroke=\"#7139CB\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><path d=\"M34.38 41.06L46.00 20.93Q50.00 14.00 54.00 20.93L57.83 27.57\" fill=\"none\" stroke=\"#7139CB\" stroke-width=\"12.5\" stroke-linecap=\"butt\" stroke-linejoin=\"round\"/><polygon points=\"66.33,42.29 45.80,33.36 68.87,20.04\" fill=\"#7139CB\" stroke=\"#7139CB\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/></svg>\n</span><span class=\"lg-d\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\" role=\"img\" aria-label=\"synofurb\"><path d=\"M69.88 48.44L81.51 68.57Q85.51 75.50 77.51 75.50L69.84 75.50\" fill=\"none\" stroke=\"#A37BFE\" stroke-width=\"12.5\" stroke-linecap=\"butt\" stroke-linejoin=\"round\"/><polygon points=\"52.84,75.50 70.84,62.18 70.84,88.82\" fill=\"#A37BFE\" stroke=\"#A37BFE\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><path d=\"M45.74 75.50L22.49 75.50Q14.49 75.50 18.49 68.57L22.33 61.93\" fill=\"none\" stroke=\"#A37BFE\" stroke-width=\"12.5\" stroke-linecap=\"butt\" stroke-linejoin=\"round\"/><polygon points=\"30.83,47.21 33.36,69.46 10.29,56.14\" fill=\"#A37BFE\" stroke=\"#A37BFE\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><path d=\"M34.38 41.06L46.00 20.93Q50.00 14.00 54.00 20.93L57.83 27.57\" fill=\"n function tooLate(api){const el=api?api.el:$('.scrim[data-dname="cinst"]');if(!el)return;$('.dlg-h span',el).textContent='Too late to cancel';$('.dlg-b',el).innerHTML='<p>The first disk is being changed. The install can no longer be stopped from here.</p><p>If it fails, a rescue shell opens for 15 minutes.</p>';const b=$('[data-dbtn="1"]',el);if(b){b.setAttribute('aria-disabled','true');b.setAttribute('tabindex','-1');b.dataset.reason='Not possible after step 3.'}}
function openDialogByName(n){const c=DLG[n]();return openDialog(c)}

function startSignin(skipTrust){const c=S.conn;c.field=null;
  if(c.auth==='Password'&&!c.pw){c.err=null;c.field='pw';render();const i=$('#c-pw');i&&i.focus();return}
  if(c.sim==='hostchanged'){c.err='hostchanged';render();openDialogByName('hostchanged');return}
  if(!c.trusted&&!skipTrust){c.err=null;openDialogByName('hostkey');return}
  c.err=null;c.state='busy';render();
  setTimeout(()=>{c.state='idle';const e=c.sim||(c.pw==='wrong'?'login':null);if(e){c.err=e;render();return}go('inspect')},S.fast?100:900)}
function startMgmtUpdate(){S.manage.mgmt='updating';S.manage.mgmtPct=4;render();clearInterval(S._mu);S._mu=setInterval(()=>{S.manage.mgmtPct+=S.fast?30:9;if(S.manage.mgmtPct>=100){clearInterval(S._mu);S.manage.mgmt='updated';S.manage.mgmtPct=100;toast('Updated to 0.9.2','circle-check')}if(S.screen==='manage')render()},700)}
function startBootInstall(){S.F.flash=true;S.boot.unit=cur().id;S.bootm={phase:'progress',pct:0,returned:false};render();clearInterval(S._bt);S._bt=setInterval(()=>{S.bootm.pct++;if(S.bootm.pct>=4){clearInterval(S._bt);S.bootm.phase='result';S.boot.done=true}if(S.screen==='boot')render()},S.fast?250:1100)}
/* ---------- navigation and rendering ---------- */
const SCREENS={find,connect,inspect,goal,setup,plan:setup,system:setup,confirm,install,failed,done,boot,recovery,manage,settings,about};
function go(screen,o={}){closePop(false);hideTip();if(['settings','about'].includes(screen)&&!['settings','about'].includes(S.screen))S.back=S.screen;
  if(screen==='plan')S.setup.tab='storage';if(screen==='system'){S.setup.tab='system';S.setup.seenSys=true}
  if(screen==='recovery'&&S.screen!=='manage')S.manage.from=S.screen==='goal'||S.screen==='failed'?S.screen:S.manage.from;
  S.screen=screen;if(o.page)S.settings.page=o.page;if(screen==='install')startInstall();
  if(screen==='failed'&&!S.fail)S.fail=mkFail('post');
  if(screen==='manage'&&!S.manage.tab)S.manage.tab='overview';
  const si=STEP_OF[screen];if(si!==undefined)S.reached=Math.max(S.reached||0,si);
  render();const m=$('.main');m&&(m.scrollTop=0);const h=$('.main h1');if(h){h.setAttribute('tabindex','-1');if(!(document.activeElement&&document.activeElement.closest('.dlg')))h.focus({preventScroll:true})}location.hash=screen}
function sig(el){return el?(el.id||el.getAttribute('data-act')||el.getAttribute('data-go')||el.getAttribute('data-sel')||el.getAttribute('data-acc')||el.getAttribute('data-mtab')||el.getAttribute('data-select')||el.getAttribute('aria-label')||el.outerHTML.slice(0,60)):''}
function render(){const a=document.activeElement,s0=a&&a.closest('.main,.foot')?sig(a):null,sel=a&&a.selectionStart!==undefined&&a.type!=='range'?[a.selectionStart,a.selectionEnd]:null,sc=$('.main')?$('.main').scrollTop:0;
  syncFacts();if(!S.sys.hostEdited&&S.unit)S.sys.host=hostOf(S.unit);
  if(S.screen==='install'&&instN()>=3)tooLate();
  document.documentElement.dataset.sheet=S.help.open?'open':'';
  const R=SCREENS[S.screen](),st=!NOSTEPPER.includes(S.screen);
  const top=(S.update&&['find','connect','inspect','goal','plan','system','setup','confirm'].includes(S.screen)?updBanner():'')+unitHdr();
  $('#shell').innerHTML=titlebar()+`<div class="top">${top}</div><main class="main" id="main" aria-label="${S.screen}">${R.html}</main>${R.foot}`+(st?stepperHTML():'')+statusbar();
  if(R.after)R.after();const m=$('.main');if(m)m.scrollTop=sc;
  if(s0){const n=$$('.main *,.foot *').find(e=>sig(e)===s0&&e.matches('button,input,[tabindex]'));if(n){n.focus({preventScroll:true});if(sel&&n.setSelectionRange)try{n.setSelectionRange(...sel)}catch(e){}}}
  document.documentElement.dataset.screen=S.screen}

function startInstall(){S.inst.step=S.inst.frozen?S.inst.step:0;S.fail=null;clearInterval(S._it);if(S.inst.frozen)return;S._it=setInterval(()=>{if(S.screen!=='install'){clearInterval(S._it);return}if(S.inst.lost)return;S.inst.step++;if(S.inst.step>=18){clearInterval(S._it);render();setTimeout(()=>S.screen==='install'&&go('done'),1200);return}render()},S.fast?250:1300)}

setInterval(()=>{const f=S.fail;if(S.screen!=='failed'||!f||S.clockFrozen||f.phase==='done')return;f.acc=(f.acc||0)+250*(window.__fast?4:1);
  while(f.acc>=1000){f.acc-=1000;
    if(f.phase==='clock'){if(f.t>0){f.t--;const c=$('#cd');if(c)c.textContent=fmt(f.t)}if(f.t<=0){f.phase='waiting';f.el=0;render()}}
    else if(f.phase==='waiting'){f.el++;const c=$('#cd');if(c)c.textContent=fmt(f.el);if(f.el>=4){f.phase=f.out||(f.kind==='post'?'loader':'back');render()}}}},250);

function init(){
  const h=location.hash.slice(1).split('?')[0].split('&')[0],q=new URLSearchParams(location.search||(location.hash.includes('?')?'?'+location.hash.split('?')[1]:''));
  const p=k=>q.get(k);
  document.documentElement.dataset.theme=p('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');S.theme=document.documentElement.dataset.theme;
  if(p('size'))setSize({large:'Large',largest:'Largest'}[p('size')]||'Default');
  if(p('bare')==='1')$('#stage').classList.add('bare');if(p('fast')){S.fast=true;window.__fast=true}
  S.update=p('update')?{state:'available'}:null;if(p('offline'))S.offline=true;S.twin=p('twin')!=='0';
  const u=p('unit');if(u){S.unit=allUnits().concat([TWIN]).find(x=>x.id===u);S.sel=u}
  if(p('raid'))S.plan.raid=p('raid');if(p('copies'))S.plan.copies=+p('copies');if(p('keep')){S.plan.mode='keep';S.plan.sys=+(p('sys')||8)}if(p('sys')&&!p('keep'))S.plan.sys=+p('sys');

  if(p('step')){S.inst.step=+p('step');S.inst.frozen=true}if(p('lost')){S.inst.lost=true}
  if(p('fail')){const v=p('fail');S.fail=mkFail(v.startsWith('pre')?'pre':v==='stopped'?'stopped':v==='agent'?'agent':v==='backup'?'backup':'post',{keep:v==='postkeep'});if(p('phase'))S.fail.phase=p('phase');if(p('out'))S.fail.out=p('out');if(p('clock'))S.fail.t=+p('clock');if(!p('run'))S.clockFrozen=true;if(p('el'))S.fail.el=+p('el')}
  if(p('health'))S.manage.health=p('health');if(p('mgmt')){S.manage.mgmt=p('mgmt');S.manage.mgmtPct=p('mgmt')==='updating'?58:100}
  if(p('layout'))S.manage.layout=p('layout');
  if(p('tab'))S.manage.tab=p('tab');if(p('page'))S.settings.page=p('page');if(p('stab'))S.setup.tab=p('stab');
  if(p('conn')){const v=p('conn');if(v==='empty'){S.conn.field='pw'}else if(v==='login'){S.conn.err='login';S.conn.pw='wrong'}else{S.conn.err=v;S.conn.sim=v}}
  if(p('facts')){const f=p('facts');if(f.includes('flash'))S.F.flash=true;if(f.includes('disks'))S.F.disks=true;if(f.includes('debian')){S.F.debian=true;S.F.dflt='debian';S.F.flash=true;S.F.disks=true}if(f.includes('fail'))S.F.fail=true}
  if(p('rec')==='result')S.rec.result={v:'ok',i:'rotate-ccw',t:'Rebooting.',s:'DSM returns in about 60 seconds.'};
  if(p('boot')){S.bootm={phase:p('boot'),pct:p('boot')==='progress'?2:4,returned:p('returned')==='1'};if(p('boot')==='result'){S.boot.done=true;S.F.flash=true;S.boot.unit=(S.unit||UNITS[1]).id}if(p('boot')==='progress')S.F.flash=true}
  if(p('scan'))S.scan=p('scan');if(p('filter'))S.filter=p('filter');if(p('acc'))p('acc').split(',').forEach(k=>S.acc[k]=true);
  if(['confirm','install','failed','done','boot','recovery','manage','plan','system','setup','inspect','goal','connect'].includes(h)&&!S.unit){S.unit=UNITS[1]}
  if(h==='manage'){S.manage.name=p('name')||cur().model;if(!p('facts'))S.F.debian=true}
  if(h==='recovery'&&!p('facts')&&!p('nofacts')){S.F.flash=true;S.F.disks=true;S.F.fail=true}
  if(h==='done'&&p('copied')){S.done.copied=true;S.done.show=p('show')==='1'}
  if(h==='plan')S.setup.tab='storage';if(h==='system')S.setup.tab='system';
  S.screen=SCREENS[h]||h==='specimens'?h:'find';

  const si=STEP_OF[S.screen];if(si!==undefined)S.reached=si;
  render();

  if(p('sheet')==='help'){S.help.tab=p('htab')||'Topics';S.help.q=p('hq')||'';openHelp(p('topic')||null)}

 const mini=(n,f)=>{let h='<nav class="stepper" style="position:static;padding:0;border:0;height:auto;grid-row:auto;background:transparent">';['Find','Connect','Goal','Setup','Confirm','Install'].forEach((l,i)=>{const c=i<n?'done':i===n?(f?'fail':'cur'):'';h+=`<div class="item"><span class="step ${c}"><span class="n">${c==='done'?ic('check','s'):c==='fail'?ic('circle-x','s'):i+1}</span><span class="lbl">${l}</span></span><span class="step-line"></span></div>`});return h+'</nav>'};
 const sbox=(cls)=>`<div class="sbbox ${cls}"><i></i></div>`;
 return {html:`<div class="page"><div class="ph"><div><h1 class="t-title">Components</h1><div class="sub t-sub">Widget states in this theme.</div></div></div><div class="specs">
 <section class="card"><div class="card-h">Stepper</div><div class="card-b">${row('Step 3 current',mini(2))}${row('Install failed',mini(5,true))}</div></section>
 <section class="card"><div class="card-h">Buttons</div><div class="card-b">
  ${row('Default',b('Cancel','')+b('Cancel','','hv')+b('Cancel','','pr')+dis('Cancel',''))}
  ${row('Primary',b('Connect','primary')+b('Connect','primary','hv')+b('Connect','primary','pr')+dis('Connect','primary'))}
  ${row('Danger',b('Erase','danger')+b('Erase','danger','hv')+b('Erase','danger','pr')+dis('Erase','danger'))}
  ${row('Ghost',b('Back','ghost')+b('Back','ghost','hv')+b('Back','ghost','pr')+dis('Back','ghost'))}</div></section>
 <section class="card"><div class="card-h">Tags</div><div class="card-b">${row('Compatibility',['verified','community','untested','issues','unsupported'].map(k=>compatTag(k)).join(''))}${row('Status',tag('Healthy',{v:'ok',i:'circle-check'})+tag('Needs attention',{v:'warn',i:'triangle-alert'})+tag('Critical',{v:'err',i:'octagon-x',fill:true})+tag('Updating',{v:'info',i:'loader-circle'})+tag('Unreachable',{i:'wifi-off'}))}</div></section>
 <section class="card"><div class="card-h">Alerts</div><div class="card-b">${alertH('info','info','<b>Information.</b> One sentence.')}${alertH('warn','triangle-alert','<b>Warning.</b> One sentence.',`<button class="btn">Action</button>`)}${alertH('err','octagon-x','<b>Error.</b> One sentence.')}</div></section>
 <section class="card"><div class="card-h">Select and Table</div><div class="card-b"><div style="width:14rem">${selectH('sp-sel',{opts:()=>RAID_OPTS,get:()=>'raid5',set:()=>{},label:'Example'})}</div>
  <div class="lb" style="position:static;width:14rem">${RAID_OPTS.slice(0,5).map(([k,l],i)=>`<button type="button" class="opt ${i===3?'hl':''}" role="option" aria-selected="${k==='raid5'}">${l}${ic('check','s')}</button>`).join('')}</div>
  <div class="card cardtbl"><table class="tbl sm"><tbody><tr><td class="rc"><span class="rad"><i></i></span></td><td>${d('DS923+')}</td><td>${d('7.2.2')}</td></tr><tr class="sel"><td class="rc"><span class="rad"><i></i></span></td><td>${d('DS918+')}</td><td>${d('7.2.2')}</td></tr></tbody></table></div></div></section>
 <section class="card"><div class="card-h">Scrollbar</div><div class="card-b"><div class="sbdemo">${sbox('')}${sbox('h')}</div><span class="sub">Idle (6 px) and hover or drag (8 px). Pill thumb, no arrows.</span></div></section>
 <section class="card"><div class="card-h">Disabled reason</div><div class="card-b">${row('Visible info icon',btn('Erase and install',{cls:'danger',off:'Missing: the phrase.'}))}<span class="sub">The icon is focusable and opens a popover; the button is not the trigger.</span></div></section>
 </div></div>`,foot:F(back('find'),'')}}
SCREENS.specimens=specimens;
init();
</script></body></html>
