[workspace]
resolver = "3"
members = ["crates/synofurb-core", "crates/synofurb"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/andreaswiren/synofurb"
rust-version = "1.85"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# Local fix so GPUI builds on Linux with current libc (see vendor/xattr/README.synofurb.md)
[patch.crates-io]
xattr = { path = "vendor/xattr" }
