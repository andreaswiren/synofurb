# Managed by synofurb. Public-key login is preferred (and is what clients try first);
# password login stays enabled so you can always get in. root cannot log in over SSH.
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication yes
KbdInteractiveAuthentication no
PermitEmptyPasswords no
MaxAuthTries 4
LoginGraceTime 30
ClientAliveInterval 120
ClientAliveCountMax 3
X11Forwarding no
Banner /etc/issue.net
