[package]
name = "synofurb-core"
description = "Discovery, planning and installer engine for synofurb"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = "0.4.45"
flate2 = "1.1.10"
hex = "0.4.3"
log = "0.4.35"
mdns-sd = "0.21.6"
rand = "0.10.3"
russh = "0.65.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha-crypt = "0.6.0"
sha2 = "0.11.1"
ssh-key = { version = "0.6.7", features = ["ed25519", "rand_core", "getrandom"] }
tar = "0.4.46"
thiserror = "2.0.21"
tiny_http = "0.12.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "io-util", "macros", "sync", "process"] }
ureq = { version = "2", features = ["json"] }
