[package]
name = "synofurb"
description = "Desktop tool that reinstalls Synology NAS units with plain Debian 13"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
log = "0.4.35"
rpassword = "7.5.4"
serde_json = "1.0.154"
synofurb-core = { path = "../synofurb-core" }
futures = "0.3"
gpui-kit = "0.8.1"
serde = { version = "1", features = ["derive"] }
