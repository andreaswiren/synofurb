[package]
name = "synofurb"
description = "Desktop tool that reinstalls Synology NAS units with plain Debian 13"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "clipboard", "links"] }
log = "0.4.35"
rfd = "0.17.2"
rpassword = "7.5.4"
serde_json = "1.0.154"
synofurb-core = { path = "../synofurb-core" }
