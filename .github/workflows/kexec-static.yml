name: kexec-static

# Builds the static `kexec` binaries the app uploads to the NAS (docs/kexec.md) and keeps them as a workflow artifact.
# Manual only. Same steps as the job of the same name in ci.yml, without the rest of the CI.
# The binaries are built from kexec-tools 2.0.32 (source tarball pinned by SHA-256 in scripts/build-kexec.sh) with the runner's native gcc. x86_64 only: the aarch64 and armv7 builds fail (docs/kexec.md).
# Inspect them before use: `file assets/kexec/amd64/kexec` must say "statically linked"; the job prints it.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kexec-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # x86_64 only, native gcc: aarch64 and armv7 do not build yet (docs/kexec.md)
      - run: scripts/build-kexec.sh x86_64
      - run: |
          file assets/kexec/*/kexec
          sha256sum assets/kexec/*/kexec
          assets/kexec/amd64/kexec --version
          scripts/test-kexec.sh assets/kexec/amd64/kexec
      - uses: actions/upload-artifact@v4
        with:
          name: kexec-static
          path: assets/kexec
          retention-days: 30
