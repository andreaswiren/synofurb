name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends parted shellcheck cpio libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  shell-and-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - run: shellcheck -s dash payload/chroot-setup.sh payload/files/usr/local/sbin/* 
      - run: shellcheck -s sh scripts/build-kexec.sh
      - run: python3 -m unittest discover -s payload/mgmt/tests -v
        working-directory: .
        env:
          PYTHONPATH: payload/mgmt
  release-binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} -p synofurb
      - uses: actions/upload-artifact@v4
        with:
          name: synofurb-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/synofurb*
  kexec-static:
    # Builds the static kexec binaries the app uploads to the NAS. Run manually (workflow_dispatch).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
      - run: for a in x86_64 aarch64 armv7; do scripts/build-kexec.sh $a; done
      - run: file assets/kexec/*/kexec
      - uses: actions/upload-artifact@v4
        with:
          name: kexec-static
          path: assets/kexec
