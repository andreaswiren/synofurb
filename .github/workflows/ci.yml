name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends parted shellcheck cpio libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  gui-walk:
    # Renders every desktop screen headless at the largest text size and fails on horizontal overflow (crates/synofurb/assets/tools/gui-walk.sh).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb imagemagick bc python3-pil mesa-vulkan-drivers libxtst6 libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev libvulkan-dev fonts-dejavu-core
      - run: cargo build -p synofurb
      - run: sh crates/synofurb/assets/tools/gui-walk.sh --text largest
        env:
          SYNOFURB_BIN: target/debug/synofurb
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
  shell-and-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - run: shellcheck -s dash payload/chroot-setup.sh payload/files/usr/local/sbin/* 
      - run: shellcheck -s sh scripts/build-kexec.sh
      - run: python3 -m unittest discover -s apps/mgmt-plane/tests -v
        working-directory: .
        env:
          PYTHONPATH: apps/mgmt-plane
  kexec-static:
    # Builds the static kexec binaries the app uploads to the NAS. Run manually (workflow_dispatch).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
      - run: for a in x86_64 aarch64 armv7; do scripts/build-kexec.sh $a; done
      - run: file assets/kexec/*/kexec
      - uses: actions/upload-artifact@v4
        with:
          name: kexec-static
          path: assets/kexec
  release-tooling:
    # Tests for the release engineering itself: installers (sh + PowerShell), packaging scripts, the design gate, the
    # release workflow's syntax. Fast, no Rust toolchain needed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck minisign rpm
      - name: shellcheck
        run: |
          shellcheck -s sh install.sh apps/mgmt-plane/install.sh
          shellcheck -x -P SCRIPTDIR scripts/package-*.sh
          shellcheck -x -e SC2016 tests/install/run-tests.sh tests/install/test-package-scripts.sh
      - name: PowerShell parser and analyzer (install.ps1)
        shell: pwsh
        run: |
          $e = $null; $t = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$t, [ref]$e)
          if ($e.Count -gt 0) { $e | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
      - name: Design-gate unit tests
        run: python3 -m unittest discover -s tests/gate -v
      - name: Installer tests against a fake release server (install.sh, install.ps1, mgmt-plane/install.sh)
        run: tests/install/run-tests.sh
      - name: Packaging script tests
        run: tests/install/test-package-scripts.sh
      - name: Workflow syntax (YAML + actionlint)
        run: |
          python3 -m pip install --quiet pyyaml==6.0.3
          python3 -c "import sys, yaml; [yaml.safe_load(open(f)) for f in ('.github/workflows/ci.yml', '.github/workflows/release.yml')]; print('yaml ok')"
          docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
      - name: The design gate must report (not enforce) on every push
        run: python3 scripts/release-gate.py --dry-run
